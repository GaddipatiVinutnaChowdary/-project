services:
  - type: web
    name: vignan-campus-presence
    runtime: docker
    region: singapore
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: vignan-campus-presence
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: vignan-campus-presence-db
          property: connectionString
      - key: SETUP_BOOTSTRAP_TOKEN
        generateValue: true
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: SESSION_HOURS
        value: "10"
      - key: PRESENCE_RETENTION_DAYS
        value: "30"
      - key: LOCATION_ACCURACY_LIMIT_M
        value: "120"

databases:
  - name: vignan-campus-presence-db
    databaseName: vignan_campus_presence
    user: vignan_campus_app
    region: singapore
    plan: free
