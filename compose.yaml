services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD in .env}
    volumes:
      - campus_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - campus-private

  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set the HTTPS campus URL in .env}
      SETUP_BOOTSTRAP_TOKEN: ${SETUP_BOOTSTRAP_TOKEN:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      SESSION_HOURS: ${SESSION_HOURS:-10}
      PRESENCE_RETENTION_DAYS: ${PRESENCE_RETENTION_DAYS:-30}
      LOCATION_ACCURACY_LIMIT_M: ${LOCATION_ACCURACY_LIMIT_M:-120}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - campus-private

volumes:
  campus_db:

networks:
  campus-private:
    internal: true
